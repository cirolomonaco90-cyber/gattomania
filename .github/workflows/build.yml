name: Compila Mostrilli

# Si avvia a ogni modifica e anche a mano (Actions -> Compila Mostrilli -> Run workflow).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Segreti opzionali: se non esistono, il build usa ID di test e salta la firma.
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Android SDK (gia' presente sul computer di GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "::warning::sdkmanager non trovato in $ANDROID_HOME: provo comunque, Gradle scarica da solo quello che serve."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Collaudo del motore dei livelli
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test-engine.js
      - run: node tools/verify-puzzles.js

      - name: APK di prova (si installa sul telefono per provare il gioco)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build-debug.log || {
            msg=$( { grep -E "^e: |error:|What went wrong|Could not|Execution failed|FAILURE" -A4 build-debug.log | head -50; echo ---; tail -n 25 build-debug.log; } | head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build fallito::$msg"
            exit 1
          }

      - name: Prepara la chiave di firma (se presente)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Manca il segreto KEYSTORE_BASE64: salto il pacchetto firmato per Google Play. Vedi LEGGIMI.md (passo 'Chiave di firma')."
          fi

      - name: Pacchetto di release (firmato se c'e' la chiave, altrimenti solo per controllo)
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ADMOB_APP_ID" ]; then echo "::warning::Nessun ID AdMob impostato: il pacchetto usa annunci di TEST e non genera guadagni."; fi
          set -o pipefail
          ./gradlew --no-daemon bundleRelease 2>&1 | tee build-release.log || {
            msg=$( { grep -E "^e: |error:|What went wrong|Could not|Execution failed|FAILURE" -A4 build-release.log | head -50; echo ---; tail -n 25 build-release.log; } | head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build release fallito::$msg"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: mostrilli-apk-di-prova
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.SIGNED == 'true'
        with:
          name: mostrilli-per-google-play
          path: app/build/outputs/bundle/release/app-release.aab
